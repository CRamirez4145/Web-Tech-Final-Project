spring.application.name=project-pulse-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/project_pulse}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:javb2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:false}

server.port=${PORT:8080}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
